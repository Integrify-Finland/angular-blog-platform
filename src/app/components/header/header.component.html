<header class="bg-white border-b">
  <nav class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="flex h-16 items-center justify-between">
      <a [routerLink]="['/blogs']" class="text-xl font-bold tracking-tight">Angular Blog</a>

      <div class="hidden md:flex items-center gap-6">
        <a
          [routerLink]="['/blogs']"
          routerLinkActive="text-blue-600"
          [routerLinkActiveOptions]="{ exact: true }"
          class="text-gray-700 hover:text-blue-700 transition font-medium"
        >
          Home
        </a>

        <a
          [routerLink]="['/dashboard']"
          routerLinkActive="text-blue-600"
          class="text-gray-700 hover:text-blue-700 transition font-medium"
        >
          Dashboard
        </a>

        @if (auth.isAdminOrEditor()) {
          <a
            [routerLink]="['/admin']"
            routerLinkActive="text-blue-600"
            class="text-gray-700 hover:text-blue-700 transition font-medium"
          >
            Admin
          </a>
        }

        @if (auth.isAuthenticated()) {
          <button
            type="button"
            (click)="logout()"
            class="text-gray-700 hover:text-blue-700 transition font-medium"
            title="Logout"
          >
            Logout
          </button>
        } @else {
          <a
            [routerLink]="['/login']"
            routerLinkActive="text-blue-600"
            class="text-gray-700 hover:text-blue-700 transition font-medium"
            title="Login"
          >
            Login
          </a>
        }
      </div>

      <button
        type="button"
        (click)="toggleMobile()"
        class="md:hidden inline-flex items-center justify-center rounded-md p-2 text-gray-600 hover:bg-gray-100"
        aria-label="Toggle navigation"
        [attr.aria-expanded]="mobileOpen ? 'true' : 'false'"
        aria-controls="mobile-menu"
      >
        @if (!mobileOpen) {
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16"/>
          </svg>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M6 18L18 6M6 6l12 12"/>
          </svg>
        }
      </button>
    </div>
  </nav>

  @if (mobileOpen) {
    <div id="mobile-menu" class="md:hidden border-t">
      <div class="px-4 py-3 space-y-2">
        <a
          [routerLink]="['/blogs']"
          routerLinkActive="text-blue-600"
          [routerLinkActiveOptions]="{ exact: true }"
          class="block text-gray-700 hover:text-blue-700 font-medium"
          (click)="toggleMobile()"
        >
          Home
        </a>

        <a
          [routerLink]="['/dashboard']"
          routerLinkActive="text-blue-600"
          class="block text-gray-700 hover:text-blue-700 font-medium"
          (click)="toggleMobile()"
        >
          Dashboard
        </a>

        @if (auth.isAdminOrEditor()) {
          <a
            [routerLink]="['/admin']"
            routerLinkActive="text-blue-600"
            class="block text-gray-700 hover:text-blue-700 font-medium"
            (click)="toggleMobile()"
          >
            Admin
          </a>
        }

        @if (auth.isAuthenticated()) {
          <button
            type="button"
            (click)="logout(); toggleMobile()"
            class="block w-full text-left text-gray-700 hover:text-blue-700 font-medium"
          >
            Logout
          </button>
        } @else {
          <a
            [routerLink]="['/login']"
            routerLinkActive="text-blue-600"
            class="block text-gray-700 hover:text-blue-700 font-medium"
            (click)="toggleMobile()"
          >
            Login
          </a>
        }
      </div>
    </div>
  }
</header>
