<div class="mx-auto max-w-3xl px-4 py-8">
  <a
    [routerLink]="['/']"
    class="inline-flex items-center gap-2 text-blue-600 hover:text-blue-700 font-medium"
  >
    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
      <path fill-rule="evenodd" d="M12.707 4.293a1 1 0 010 1.414L9.414 9H16a1 1 0 110 2H9.414l3.293 3.293a1 1 0 11-1.414 1.414l-5-5a.997.997 0 010-1.414l5-5a1 1 0 011.414 0z" clip-rule="evenodd"/>
    </svg>
    Back to Blogs
  </a>

  @if (blog().id === 0) {
    <div class="mt-6 text-gray-500">Loading blog…</div>
  } @else {
    <article class="mt-6 bg-white shadow rounded-lg p-6">
      <h1 class="text-3xl font-bold mb-2">
        {{ blog().title }}
      </h1>

      <div class="text-sm text-gray-500 mb-6">
        <span>{{ blog().date }}</span>
        <span class="mx-2">•</span>
        <span>Author #{{ blog().authorId }}</span>
      </div>

      <div class="prose max-w-none text-gray-800 leading-7 whitespace-pre-line">
        {{ blog().content }}
      </div>
    </article>
  }
</div>
